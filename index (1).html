<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習ゲームセンター</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fff8e7;color:#222}
.wrap{max-width:820px;margin:auto;padding:24px;text-align:center}
h1{font-size:clamp(30px,7vw,48px);margin:12px 0}
p{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}
.card{background:white;border:3px solid #333;border-radius:22px;padding:20px 12px;box-shadow:0 5px 12px rgba(0,0,0,.08)}
.card h2{margin:0 0 12px;font-size:clamp(24px,6vw,34px)}
.gamebtn{display:block;text-decoration:none;color:#222;background:#fff4c4;border:2px solid #333;border-radius:14px;padding:14px 8px;margin:9px 0;font-size:20px;font-weight:800}
.disabled{opacity:.45}
.wide{grid-column:1/-1}
small{display:block;font-size:15px;font-weight:500;margin-top:6px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 学習ゲームセンター 🎮</h1>
  <p>やりたい がくしゅうを えらんでね！</p>

  <div class="grid">
    <div class="card disabled"><h2>🌷 1ねんせい</h2><small>じゅんびちゅう</small></div>

    <div class="card">
      <h2>🚗 3年生</h2>
      <a class="gamebtn" href="romaji-game.html">🔤 ローマ字チャレンジ</a>
      <a class="gamebtn" href="kuku-kart.html">🏎️ 九九カートレース</a>
    </div>

    <div class="card disabled"><h2>⭐ 4年生</h2><small>準備中</small></div>
    <div class="card disabled"><h2>🚀 5年生</h2><small>準備中</small></div>
    <div class="card disabled"><h2>🏆 6年生</h2><small>準備中</small></div>
    <div class="card disabled wide"><h2>🌱 みんな・自立活動</h2><small>準備中</small></div>
  </div>
</div>
</body>
</html>
